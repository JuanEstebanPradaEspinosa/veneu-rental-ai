<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ocean" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#6ec6f5"/>
      <stop offset="35%" stop-color="#3a96e0"/>
      <stop offset="70%" stop-color="#1f6cc0"/>
      <stop offset="100%" stop-color="#0d3e86"/>
    </radialGradient>
    <radialGradient id="land" cx="34%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#9ed46e"/>
      <stop offset="45%" stop-color="#5aab48"/>
      <stop offset="100%" stop-color="#2c6e34"/>
    </radialGradient>
    <radialGradient id="shade" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#001a3d" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe">
      <circle cx="32" cy="32" r="29"/>
    </clipPath>
  </defs>

  <!-- ocean sphere -->
  <circle cx="32" cy="32" r="29" fill="url(#ocean)"/>

  <!-- continents -->
  <g clip-path="url(#globe)" fill="url(#land)">
    <!-- North America -->
    <path d="M6 12 Q13 6 22 7 Q29 8 30 13 Q30.5 17 25 18 Q20 18.5 19 22 Q18.5 26 14 26 Q9 25 7 20 Q5 16 6 12 Z"/>
    <!-- Central America bridge -->
    <path d="M17 26 Q21 25 23 28 Q25 31 23.5 33 Q21 35 19 32 Q17 29 17 26 Z"/>
    <!-- South America -->
    <path d="M23 33 Q28 31 31 35 Q33 39 31.5 45 Q30 51 26 52 Q23 52 22.5 47 Q22 39 23 33 Z"/>
    <!-- Greenland -->
    <path d="M28 4 Q33 3 35 6 Q36 9 33 10.5 Q29 11.5 27.5 9 Q26.5 6 28 4 Z"/>
    <!-- Europe -->
    <path d="M42 8 Q48 6 52 9 Q55 12 52.5 14.5 Q49 17 45 15.5 Q41 14 41 11 Q41 9 42 8 Z"/>
    <!-- Africa -->
    <path d="M44 18 Q51 16 55 21 Q59 26 57 33 Q55 40 50 42 Q45 43 43 38 Q40.5 31 41.5 24 Q42.5 19 44 18 Z"/>
    <!-- Australia -->
    <path d="M50 47 Q55 45.5 58 48 Q60 51 57 53.5 Q53 56 50 53.5 Q47.5 50.5 50 47 Z"/>
  </g>

  <!-- ice caps -->
  <g clip-path="url(#globe)" fill="#eaf6ff">
    <path d="M22 1 Q32 -2 42 1 Q47 2.5 46 4.5 Q40 7 32 6.5 Q24 6 19 3.5 Q19.5 1.8 22 1 Z" opacity=".9"/>
    <path d="M20 61 Q32 65 45 61 Q48 60 46 58.5 Q38 56 31 56.5 Q24 57 18.5 59.5 Q18.5 60.5 20 61 Z" opacity=".85"/>
  </g>

  <!-- sphere shading + sun highlight -->
  <circle cx="32" cy="32" r="29" fill="url(#shade)"/>
  <circle cx="32" cy="32" r="29" fill="url(#shine)"/>

  <!-- thin atmosphere rim -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#9fd2ff" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
